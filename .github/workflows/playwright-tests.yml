name: UI & API Automation

on:
  push:
    branches:
      - main

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-automation .

      - name: Create container
        run: docker create --name automation-tests playwright-automation

      - name: Run automated tests
        run: docker start -a automation-tests

      - name: Copy test artifacts
        if: always()
        run: docker cp automation-tests:/app/target ./target

      - name: Remove container
        if: always()
        run: docker rm automation-tests

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: |
            target/cucumber-pretty.html
